<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <title>AutoTyper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div>
        <h1>AutoTyper</h1>
        <p class="subtitle">Types your text into the window you pick.</p>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="card-head">
          <label for="targetWindow">Target window</label>
          <button type="button" id="refreshWindowsBtn" class="btn-avg">Refresh</button>
        </div>
        <div class="row">
          <label for="targetWindow">Window</label>
          <select id="targetWindow"></select>
        </div>
        <p class="hint" id="targetHint">&nbsp;</p>
      </section>

      <section class="card">
        <div class="card-head">
          <label for="text">Text to type</label>
          <span class="muted" id="charCount">0 characters</span>
        </div>
        <textarea
          id="text"
          spellcheck="false"
          placeholder="Type or paste the text you want played back as keystrokes..."
        ></textarea>
      </section>

      <section class="card">
        <div class="card-head"><label>Speed</label></div>

        <div class="row">
          <label for="wpm">Speed</label>
          <input type="range" id="wpmRange" min="20" max="1200" step="10" />
          <input type="number" id="wpm" min="1" max="20000" step="10" />
          <span class="unit">WPM</span>
          <button type="button" id="avgSpeedBtn" class="btn-avg">Average human</button>
        </div>

        <p class="hint" id="estimate">&nbsp;</p>
      </section>

      <section class="card">
        <div class="card-head"><label>Human typing</label></div>

        <div class="row">
          <label for="humanize">Rhythm</label>
          <label class="check">
            <input type="checkbox" id="humanize" />
            <span>Vary timing using the trained model</span>
          </label>
        </div>

        <div class="row" id="errorRow">
          <label for="errorPct">Typos</label>
          <input type="range" id="errorPctRange" min="0" max="10" step="0.1" />
          <input type="number" id="errorPct" min="0" max="10" step="0.1" />
          <span class="unit">per 100</span>
          <button type="button" id="humanErrorBtn" class="btn-avg">Human rate</button>
        </div>
      </section>
    </main>

    <footer class="controls">
      <div class="progress">
        <div class="bar"><div class="fill" id="progressFill"></div></div>
        <span class="muted" id="progressText">Ready</span>
      </div>
      <button type="button" id="startBtn" class="primary">Start typing</button>
    </footer>

    <div class="overlay hidden" id="overlay">
      <div class="overlay-inner">
        <div class="count" id="countdown">3</div>
        <p id="overlayHint">Switching to the window you picked...</p>
        <button type="button" id="cancelBtn" class="ghost">Cancel</button>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script src="renderer.js"></script>
  </body>
</html>
